name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (tests + migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: viswasimi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/viswasimi_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/viswasimi_test
      INTERNAL_API_KEY: ci-internal-key
      OPENAI_API_KEY: sk-ci-placeholder
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: apps/backend
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: apps/backend
        run: pytest -v

      - name: Verify Alembic config loads
        working-directory: apps/backend
        run: alembic heads

      - name: Apply migrations (if any exist yet)
        working-directory: apps/backend
        run: alembic upgrade head

  rag-backend:
    name: RAG backend (import check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/rag_backend/requirements.txt

      - name: Install dependencies
        working-directory: apps/rag_backend
        run: pip install -r requirements.txt

      # rag_backend's PGVector store connects to Postgres eagerly at import
      # time to create the vector extension, so a full app import needs a
      # real database with pgvector installed. Compiling every module at
      # least catches syntax errors and missing imports without that setup.
      - name: Byte-compile all modules
        working-directory: apps/rag_backend
        run: python -m compileall -q app

  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Build
        working-directory: apps/web
        run: pnpm build
